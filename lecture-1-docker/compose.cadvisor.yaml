services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: lab1-cadvisor
    runtime: runc
    privileged: true
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
