image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
enabled: false
instances: 1
bootstrap: {}
storage:
  size: 1Gi

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

networkPolicy:
  enabled: false
  # Everything below podSelector is passed directly to NetworkPolicy.spec.
  # Example:
  # spec:
  #   policyTypes:
  #     - Ingress
  #     - Egress
  #   ingress: []
  #   egress: []
  spec: {}

priorityClass:
  enabled: false
  # Leave empty to use <release-fullname>-priority.
  name: ""
  value: 0
  globalDefault: false
  # Allowed values: PreemptLowerPriority or Never.
  preemptionPolicy: PreemptLowerPriority
  description: ""

secret:
  enabled: false
  name: ""
  type: Opaque
  annotations: {}
  data: {}
  stringData: {}

nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # Required when create is true. With create=false, references an existing SA.
  # Leave empty with create=false to let CloudNativePG create the cluster's SA.
  name: ""
