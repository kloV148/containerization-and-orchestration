image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
enabled: false
instances: 1
bootstrap: {}
storage:
  size: 1Gi

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

networkPolicy:
  enabled: false
  # Everything below podSelector is passed directly to NetworkPolicy.spec.
  # Example:
  # spec:
  #   policyTypes:
  #     - Ingress
  #     - Egress
  #   ingress: []
  #   egress: []
  spec: {}

priorityClass:
  enabled: false
  # Leave empty to use <release-fullname>-priority.
  name: ""
  value: 0
  globalDefault: false
  # Allowed values: PreemptLowerPriority or Never.
  preemptionPolicy: PreemptLowerPriority
  description: ""

secret:
  enabled: false
  name: ""
  type: Opaque
  annotations: {}
  data: {}
  stringData: {}

nameOverride: ""
fullnameOverride: ""
