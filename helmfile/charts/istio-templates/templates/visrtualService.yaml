apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-route
spec:
  hosts:
  - api-lab3.api.svc.cluster.local
  http:
  - route:
    - destination:
        host: api-lab3.api.svc.cluster.local
        subset: v1
      weight: 90
    # retries:
    #   attempts: 2
    #   perTryTimeout: 1s
    #   retryOn: 5xx
    - destination:
        host: api-lab3.api.svc.cluster.local
        subset: v2
      weight: 10
