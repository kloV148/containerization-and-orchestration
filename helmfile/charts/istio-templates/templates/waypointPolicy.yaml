apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waypoint-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: waypoint
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istiod
      ports:
        - protocol: TCP
          port: 15012
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
              app.kubernetes.io/part-of: shop
              app.kubernetes.io/lab: lab3
      ports:
        - protocol: TCP
          port: 15008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waypoint-metrics-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-class-name: istio-waypoint
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 15090
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 15008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress-from-waypoint
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/part-of: shop
      app.kubernetes.io/lab: lab3
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: waypoint
      ports:
        - protocol: TCP
          port: 15008
