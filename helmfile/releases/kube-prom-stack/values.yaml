crds:
  enabled: true

defaultRules:
  create: false

kubernetesServiceMonitors:
  enabled: true

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  image:
    registry: registry.k8s.io
    repository: kube-state-metrics/kube-state-metrics
    tag: "v2.20.0"

nodeExporter:
  enabled: false

grafana:
  enabled: true
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: "13.2.2-distroless"
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.local
    path: "/"
    pathType: Prefix
    tls: []
  persistence:
    type: pvc
    enabled: true
  sidecar:
    image:
      tag: "2.11.2"
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "true"
  admin:
    existingSecret: kube-prometheus-stack-secrets
    userKey: admin_user
    passwordKey: admin_password

alertmanager:
  enabled: true
  tplConfig: true
  stringConfig: |-
    global: {}
    templates:
      - /etc/alertmanager/config/*.tmpl
    route:
      group_wait: 10s
      group_interval: 5m
      receiver: telegram
      repeat_interval: 1h
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/am-secrets/bot-token
            chat_id_file: /etc/am-secrets/chat-id
            send_resolved: true
            message: '{{`{{ template "telegram.lab2.text" . }}`}}'
  alertmanagerSpec:
    image:
      tag: "v0.34.1"
    volumes:
      - name: chat-bot-token
        secret:
          secretName: kube-prometheus-stack-secrets
    volumeMounts:
      - name: chat-bot-token
        mountPath: /etc/am-secrets/
        readOnly: true

prometheusOperator:
  enabled: true
  image:
    tag: "v0.94.1"
  prometheusConfigReloader:
    image:
      tag: "v0.94.1"
  admissionWebhooks:
    patch:
      image:
        tag: "1.8.8"

prometheus:
  enabled: true
  prometheusSpec:
    image:
      tag: "v3.14.0-distroless"

extraManifests:
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: kube-prometheus-stack-secrets
      namespace: {{ .Release.Namespace }}
    type: Opaque
    stringData:
      bot-token: {{ .Values.prometheusSecret.bot_token | quote }}
      chat-id: {{ .Values.prometheusSecret.chat_id | quote }}
      admin_user: {{ .Values.prometheusSecret.admin_user | quote }}
      admin_password: {{ .Values.prometheusSecret.admin_password | quote }}
