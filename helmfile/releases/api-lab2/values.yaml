image:
  repository: ghcr.io/klov148/api-lab2
  pullPolicy: IfNotPresent
  tag: "latest"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.observability.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "api-lab2"

podLabels:
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: shop
  app.kubernetes.io/lab: lab2

# Нужно для работы prometheus discovery
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "8080"

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: api-lab2.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

nameOverride: api-lab2
fullnameOverride:  api-lab2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/region
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/lab: lab2
    matchLabelKeys:
      - pod-template-hash
