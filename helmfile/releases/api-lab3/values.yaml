image:
  repository: ghcr.io/klov148/api-lab3
  pullPolicy: IfNotPresent
  tag: latest

env:
  PGHOST: "postgres-lab3-rw"
  PGPORT: "5432"
  PGDATABASE: "app"
  PGSSLMODE: "disable"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.observability.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "api-lab3"

secretEnv:
  PGUSER:
    name: postgres-lab3-secret
    key: username
  PGPASSWORD:
    name: postgres-lab3-secret
    key: password

podLabels:
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: shop
  app.kubernetes.io/lab: lab3

podDisruptionBudget:
  enabled: true
  budgetType: minAvailable
  podCount: 1

priorityClass:
  enabled: true
  value: 100000
  globalDefault: false
  preemptionPolicy: PreemptLowerPriority
  description: High priority for the critical API path

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: api-lab3.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

nameOverride: api-lab3
fullnameOverride: api-lab3

replicaCount: 2
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

resources:
  limits:
    cpu: 100m
    memory: 100Mi
  requests:
    cpu: 100m
    memory: 100Mi

networkPolicy:
  enabled: true
  spec:
    policyTypes:
      - Ingress
      - Egress
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
        ports:
          - protocol: TCP
            port: 8080
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - to:
          - podSelector:
              matchLabels:
                cnpg.io/cluster: postgres-lab3
        ports:
          - protocol: TCP
            port: 5432
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: jaeger
        ports:
          - protocol: TCP
            port: 4318

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/region
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/lab: lab3
    matchLabelKeys:
      - pod-template-hash
