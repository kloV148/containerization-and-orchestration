replicaCount: 2

image:
  repository: ghcr.io/klov148/worker-lab3
  pullPolicy: IfNotPresent
  tag: "latest"

env:
  POLL_INTERVAL: "1s"
  PGHOST: "postgres-lab3-rw"
  PGPORT: "5432"
  PGDATABASE: "app"
  PGSSLMODE: "disable"

secretEnv:
  PGUSER:
    name: postgres-lab3-secret
    key: username
  PGPASSWORD:
    name: postgres-lab3-secret
    key: password

podLabels:
  app.kubernetes.io/component: worker
  app.kubernetes.io/part-of: shop
  app.kubernetes.io/lab: lab3

podDisruptionBudget:
  enabled: true
  budgetType: minAvailable
  podCount: 1

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: worker-lab3.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 100Mi
  requests:
    cpu: 10m
    memory: 100Mi

networkPolicy:
  enabled: true
  spec:
    policyTypes:
      - Ingress
      - Egress
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
        ports:
          - protocol: TCP
            port: 8080
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - to:
          - podSelector:
              matchLabels:
                cnpg.io/cluster: postgres-lab3
        ports:
          - protocol: TCP
            port: 5432

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

nameOverride: worker-lab3
fullnameOverride: worker-lab3

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/region
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/lab: lab3
    matchLabelKeys:
      - pod-template-hash
