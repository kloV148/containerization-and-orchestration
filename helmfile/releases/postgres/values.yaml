enabled: true
instances: 1
bootstrap:
  initdb:
    database: app
    owner: app
    secret:
      name: postgres-lab3-secret
storage:
  size: 1Gi
  storageClass: local-path

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi

secret:
  enabled: true
  name: postgres-lab3-secret
  type: kubernetes.io/basic-auth

fullnameOverride: postgres-lab3
