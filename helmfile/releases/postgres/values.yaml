enabled: true
instances: 1
bootstrap:
  initdb:
    database: app
    owner: app
    secret:
      name: postgres-lab3-secret
storage:
  size: 1Gi
  storageClass: local-path

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: "1"
    memory: 512Mi

networkPolicy:
  enabled: true
  spec:
    policyTypes:
      - Ingress
      - Egress
    ingress:
      - from:
          - podSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - api
                    - worker
        ports:
          - protocol: TCP
            port: 5432
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: cnpg-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
        ports:
          - protocol: TCP
            port: 8000
      - from:
          - podSelector:
              matchLabels:
                cnpg.io/cluster: postgres-lab3
        ports:
          - protocol: TCP
            port: 5432
          - protocol: TCP
            port: 8000
    egress:
      - ports:
      #     - protocol: TCP
      #       port: 443
          - protocol: TCP
            port: 6443
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - to:
          - podSelector:
              matchLabels:
                cnpg.io/cluster: postgres-lab3
        ports:
          - protocol: TCP
            port: 5432
          - protocol: TCP
            port: 8000

priorityClass:
  enabled: true
  value: 100000
  globalDefault: false
  preemptionPolicy: PreemptLowerPriority
  description: High priority for the critical PostgreSQL path

secret:
  enabled: true
  name: postgres-lab3-secret
  type: kubernetes.io/basic-auth

fullnameOverride: postgres-lab3
