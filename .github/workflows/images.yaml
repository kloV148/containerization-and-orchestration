name: Build APIs

on:
  push:
    # paths:
    #   - 'lecture-*/api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - { context: lecture-2-observability/api, image: "ghcr.io/klov148/api-lab2" }
          - { context: lecture-3-kubernetes-control-plane/api, image: "ghcr.io/klov148/api-lab3" }
          
    permissions:
      contents: read
      packages: write
      id-token: write
      
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      # нужно для сборки под разные архитектуры
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "${{ matrix.context }}"
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}