name: Build APIs

on:
  push:
    # paths:
    #   - 'lecture-*/api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - { context: lecture-2-observability/api, image: "ghcr.io/klov148/api-lab2" }
          - { context: lecture-3-kubernetes-control-plane/api, image: "ghcr.io/klov148/api-lab3" }
          
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      # нужно для сборки под разные архитектуры
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: "${{ matrix.context }}"
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Sign and verify
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign sign --yes "${{ matrix.image }}@${DIGEST}"

          cosign verify "${{ matrix.image }}@${DIGEST}" \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/images.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
